# Rasa Open Source 3.x | KMA FAQ + giao tiep + RAG fallback
recipe: default.v1
assistant_id: kma_student_support_expanded_2026
language: vi

pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
    case_sensitive: false
  - name: CountVectorsFeaturizer
    analyzer: word
    min_ngram: 1
    max_ngram: 2
    lowercase: true
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 2
    max_ngram: 5
    lowercase: true
  - name: DIETClassifier
    epochs: 100
    batch_size: [32, 128]
    constrain_similarities: true
    entity_recognition: false
  # Moi chu de co ResponseSelector rieng tranh so sanh qua 169 intent con.
